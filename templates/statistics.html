{% extends "base.html" %}
{% block title %}Estadísticas privadas · El Ciro{% endblock %}
{% block content %}
<section class="intro compact"><p class="eyebrow">Solo para ti.</p><h1>Tu audiencia.</h1><p id="statsStatus" role="status">Verificando acceso…</p></section>
<div id="statsSummary" class="stats-grid"></div>
<div class="table-wrap" id="statsTable" hidden><table><thead><tr><th>Partido o canal</th><th>Viendo</th><th>Entradas</th><th>Visitantes</th></tr></thead><tbody id="statsRows"></tbody></table></div>
{% endblock %}
{% block scripts %}<script>
document.addEventListener('DOMContentLoaded', () => {
    let timer;
    async function refresh() {
        let auth = window.Telegram?.WebApp?.initData || ''; try {auth ||= sessionStorage.getItem('elciro_init') || '';}catch(_){}
        const response = await fetch('/api/admin/statistics',{headers:{'X-Telegram-Init-Data':auth},cache:'no-store'});
        if(!response.ok) { document.getElementById('statsStatus').textContent='Abre esta sección desde tu cuenta autorizada en Telegram.'; clearInterval(timer); return; }
        const data = await response.json(); document.getElementById('statsStatus').textContent='Una mirada a quienes comparten el deporte contigo.';
        const summary=document.getElementById('statsSummary'); summary.replaceChildren();
        for(const [label,value] of [['Reproduciendo ahora',data.watching],['Usuarios del bot',data.bot_users],['Entradas a la Mini App',data.app_entries],['Entradas al reproductor',data.player_entries],['Visitantes del reproductor',data.player_visitors],['Interacciones del bot',data.bot_entries]]) {
            const card=document.createElement('div');card.className='stat-card';const name=document.createElement('p');name.className='stat-label';name.textContent=label;const count=document.createElement('p');count.className='stat-value';count.textContent=Number(value).toLocaleString('es');card.append(name,count);summary.append(card);
        }
        const rows=document.getElementById('statsRows'); rows.replaceChildren();
        for(const match of data.matches){const row=document.createElement('tr');for(const value of [match.title,match.watching,match.entries,match.visitors]){const cell=document.createElement('td');cell.textContent=value;row.append(cell);}rows.append(row);}
        document.getElementById('statsTable').hidden=false;
        if(!document.getElementById('statsNote')){const note=document.createElement('p');note.id='statsNote';note.className='schedule-note';note.textContent='Actividad estimada del video en los últimos 45 segundos. Visitantes por navegador. Actualización cada 15 segundos.';document.getElementById('statsTable').after(note);}
    }
    refresh().catch(()=>document.getElementById('statsStatus').textContent='No se pudo conectar. Vuelve a intentar en un momento.'); timer=setInterval(()=>refresh().catch(()=>{}),15000);
});
</script>{% endblock %}
