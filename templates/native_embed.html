<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{ channel_name }} · En vivo</title><script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.7/dist/hls.min.js"></script>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000;color:white;font-family:system-ui}video{display:block;width:100%;height:100%;object-fit:contain;filter:none;transform:none}#notice{position:absolute;bottom:65px;left:12px;right:12px;background:#121214e8;padding:12px;border-radius:12px;text-align:center}button{padding:10px 16px;border:0;border-radius:8px;background:#24a1de;color:white}</style></head><body>
<video id="video" controls playsinline webkit-playsinline autoplay></video><div id="notice" hidden><p id="message"></p><button id="retry">Reintentar</button></div>
<script type="application/json" id="nativeConfig">{{ {"source":stream_url,"slug":slug}|tojson }}</script>
<script src="{{ url_for('static', filename='native-player.js', v='1') }}"></script>
</body></html>
