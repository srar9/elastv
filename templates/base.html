<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>{% block title %}ElCiro - En Vivo{% endblock %}</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        apple: {
                            bg: '#000000',
                            surface: '#121214',
                            card: 'rgba(255, 255, 255, 0.04)',
                            cardHover: 'rgba(255, 255, 255, 0.08)',
                            border: 'rgba(255, 255, 255, 0.08)',
                            borderHighlight: 'rgba(255, 255, 255, 0.16)',
                            red: '#ff3b30',
                            redGlow: 'rgba(255, 59, 48, 0.25)',
                            textSecondary: '#86868b',
                            textTertiary: '#6e6e73'
                        }
                    },
                    fontFamily: {
                        apple: ['-apple-system', 'BlinkMacSystemFont', '"SF Pro Display"', '"SF Pro Text"', 'system-ui', 'Helvetica Neue', 'sans-serif']
                    }
                }
            }
        }
    </script>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        :root {
            --sat: env(safe-area-inset-top, 0px);
            --sab: env(safe-area-inset-bottom, 0px);
        }

        body {
            background-color: #000000;
            color: #f5f5f7;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", system-ui, "Helvetica Neue", Helvetica, Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            overflow-x: hidden;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }

        /* Apple Glassmorphism */
        .apple-glass {
            background: rgba(18, 18, 20, 0.72);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .apple-glass-card {
            background: rgba(255, 255, 255, 0.035);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.07);
        }

        .apple-glass-card:active {
            transform: scale(0.985);
            background: rgba(255, 255, 255, 0.06);
            transition: transform 0.12s ease-out, background 0.12s ease-out;
        }

        .apple-pill {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        .apple-pill-active {
            background: #ffffff;
            color: #000000;
            border: 1px solid #ffffff;
            box-shadow: 0 4px 12px rgba(255, 255, 255, 0.15);
        }

        /* Smooth Hide Scrollbars but allow scroll */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* Pulsing Dot */
        .pulse-apple {
            animation: pulseApple 2s infinite cubic-bezier(0.4, 0, 0.6, 1);
        }
        @keyframes pulseApple {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.85); }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between selection:bg-red-600/30 selection:text-white">

    <!-- BARRA SUPERIOR MINIMALISTA APPLE -->
    <header class="sticky top-0 z-40 bg-black/80 backdrop-blur-2xl border-b border-white/[0.06] pt-[env(safe-area-inset-top,0px)]">
        <div class="max-w-4xl mx-auto px-4 sm:px-6 h-14 flex items-center justify-between">
            
            <!-- LOGO APPLE-STYLE -->
            <a href="/" class="flex items-center space-x-2 group">
                <div class="w-8 h-8 rounded-xl bg-gradient-to-tr from-red-600 to-red-500 flex items-center justify-center shadow-lg shadow-red-600/20 group-active:scale-95 transition-transform">
                    <i data-lucide="play" class="w-4 h-4 text-white fill-white ml-0.5"></i>
                </div>
                <div class="flex flex-col">
                    <span class="text-base font-bold tracking-tight text-white flex items-center gap-1.5">
                        ElCiro <span class="text-xs font-semibold text-red-500 px-1.5 py-0.2 rounded-md bg-red-500/10 border border-red-500/20">LIVE</span>
                    </span>
                </div>
            </a>

            <!-- ESTADO, CANAL TELEGRAM Y REFRESCAR -->
            <div class="flex items-center space-x-2">
                <a href="https://t.me/elasdelfutbol" target="_blank" class="flex items-center space-x-1.5 px-2.5 py-1 rounded-full bg-[#24A1DE]/15 border border-[#24A1DE]/30 text-[#24A1DE] hover:bg-[#24A1DE]/25 active:scale-95 transition text-[11px] font-medium">
                    <i data-lucide="send" class="w-3 h-3"></i>
                    <span class="font-semibold">@elasdelfutbol</span>
                </a>
                <button onclick="window.location.reload()" class="w-8 h-8 rounded-full apple-pill flex items-center justify-center text-white/80 hover:text-white active:scale-90 transition">
                    <i data-lucide="rotate-cw" class="w-3.5 h-3.5"></i>
                </button>
                <div class="hidden sm:flex items-center space-x-1.5 text-[11px] font-medium px-2.5 py-1 rounded-full bg-emerald-500/10 border border-emerald-500/20 text-emerald-400">
                    <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 pulse-apple"></span>
                    <span>Señal Activa</span>
                </div>
            </div>

        </div>
    </header>

    <!-- CONTENIDO PRINCIPAL -->
    <main class="max-w-4xl mx-auto px-3 sm:px-6 py-4 flex-grow w-full pb-28">
        {% block content %}{% endblock %}

        <!-- FOOTER CANAL TELEGRAM -->
        <footer class="pt-8 pb-4 text-center space-y-2 border-t border-white/[0.04] mt-8">
            <p class="text-xs text-white/50 flex items-center justify-center gap-1.5">
                <i data-lucide="send" class="w-3.5 h-3.5 text-[#24A1DE]"></i>
                <span>Canal Oficial de Telegram:</span>
                <a href="https://t.me/elasdelfutbol" target="_blank" class="text-[#24A1DE] font-semibold hover:underline">
                    @elasdelfutbol
                </a>
            </p>
            <p class="text-[10px] text-white/30">
                ElCiro Live • Transmisiones deportivas 24/7 en HD sin publicidad
            </p>
        </footer>
    </main>

    <!-- BARRA DE NAVEGACIÓN INFERIOR ESTILO iOS / APPLE TAB BAR -->
    <nav class="fixed bottom-0 left-0 right-0 z-50 bg-black/85 backdrop-blur-2xl border-t border-white/[0.08] pb-[env(safe-area-inset-bottom,8px)] pt-2">
        <div class="max-w-md mx-auto px-4 flex items-center justify-around h-12">
            
            <!-- TAB 1: PARTIDOS -->
            <a href="/" class="flex flex-col items-center justify-center space-y-0.5 group w-14 {% if active_page == 'home' %}text-red-500 font-semibold{% else %}text-white/40 hover:text-white/80{% endif %} transition">
                <i data-lucide="calendar" class="w-5 h-5 group-active:scale-90 transition-transform"></i>
                <span class="text-[10px] tracking-tight">Partidos</span>
            </a>

            <!-- TAB 2: CANALES -->
            <a href="/canales" class="flex flex-col items-center justify-center space-y-0.5 group w-14 {% if active_page == 'channels' %}text-red-500 font-semibold{% else %}text-white/40 hover:text-white/80{% endif %} transition">
                <i data-lucide="tv" class="w-5 h-5 group-active:scale-90 transition-transform"></i>
                <span class="text-[10px] tracking-tight">Canales</span>
            </a>

            <!-- TAB 3: BUSCADOR -->
            <button onclick="focusSearch()" class="flex flex-col items-center justify-center space-y-0.5 group w-14 text-white/40 hover:text-white/80 transition">
                <i data-lucide="search" class="w-5 h-5 group-active:scale-90 transition-transform"></i>
                <span class="text-[10px] tracking-tight">Buscar</span>
            </button>

            <!-- TAB 4: CANAL OFICIAL TELEGRAM -->
            <a href="https://t.me/elasdelfutbol" target="_blank" class="flex flex-col items-center justify-center space-y-0.5 group w-14 text-[#24A1DE]/80 hover:text-[#24A1DE] transition">
                <i data-lucide="send" class="w-5 h-5 group-active:scale-90 transition-transform"></i>
                <span class="text-[10px] tracking-tight font-medium">Canal</span>
            </a>

        </div>
    </nav>

    <!-- SCRIPTS DE TELEGRAM WEBAPP & LUCIDE -->
    <script>
        // Inicializar iconos
        lucide.createIcons();

        // Haptic Feedback Helper
        function triggerHaptic(type = 'light') {
            try {
                if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.HapticFeedback) {
                    window.Telegram.WebApp.HapticFeedback.impactOccurred(type);
                }
            } catch(e) {}
        }

        // Global touch feedback on clickable elements
        document.addEventListener('click', (e) => {
            const el = e.target.closest('a, button, [role="button"]');
            if (el) triggerHaptic('light');
        });

        // Configuración oficial Telegram WebApp
        if (window.Telegram && window.Telegram.WebApp) {
            const tg = window.Telegram.WebApp;
            tg.ready();
            tg.expand();

            try {
                tg.setHeaderColor('#000000');
                tg.setBackgroundColor('#000000');
            } catch(e) {}

            // Soporte para botón Volver nativo de Telegram
            if (tg.BackButton) {
                const isHome = window.location.pathname === '/' || window.location.pathname === '';
                const isPlayer = window.location.pathname.startsWith('/ver/');
                if (!isHome) {
                    tg.BackButton.show();
                    tg.BackButton.onClick(() => {
                        triggerHaptic('medium');
                        if (isPlayer) {
                            window.location.href = '/';
                        } else if (window.history.length > 1) {
                            window.history.back();
                        } else {
                            window.location.href = '/';
                        }
                    });
                } else {
                    tg.BackButton.hide();
                }
            }
        }

        // Helper de búsqueda desde la barra de pestañas
        function focusSearch() {
            triggerHaptic('light');
            const searchInput = document.getElementById('matchSearch') || document.getElementById('channelSearch');
            if (searchInput) {
                searchInput.focus();
                searchInput.scrollIntoView({ behavior: 'smooth', block: 'center' });
            } else {
                window.location.href = '/';
            }
        }
    </script>
    {% block scripts %}{% endblock %}
<script>
try {
    const init = window.Telegram?.WebApp?.initData;
    if(init) sessionStorage.setItem('elciro_init', init);
    const appSession = 'a_' + (crypto.randomUUID ? crypto.randomUUID() : Date.now() + Math.random().toString(36).slice(2));
    if(!sessionStorage.getItem('elciro_app_session')) sessionStorage.setItem('elciro_app_session', appSession);
    fetch('/api/audience', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({
        session_id:sessionStorage.getItem('elciro_app_session'), match_id:'__app__', title:'Mini App', playing:false})}).catch(() => {});
    const auth = init || sessionStorage.getItem('elciro_init') || '';
    if(auth) fetch('/api/admin/statistics', {headers:{'X-Telegram-Init-Data':auth}}).then(response => {
        if(!response.ok) return;
        const link = document.createElement('a'); link.href='/estadisticas'; link.textContent='📊 Estadísticas privadas';
        link.className='block max-w-4xl mx-auto p-4 text-sm text-cyan-400'; document.body.append(link);
    }).catch(() => {});
} catch (_) {}
</script>
</body>
</html>
